
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunnyside Agency Landing Page</title>
    <link rel="shortcut icon" href="./images/favicon-32x32.png" type="image/x-icon">
    <link rel="stylesheet" href="./css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="wrapper">
        <section class="hero">
            <header class="header">
                <div class="header-logo">
                    <img src="./images/logo.svg" alt="Logo">
                </div>
                <nav class="menu">
                    <ul class="menu-list">
                        <li class="menu-link">
                            <a href="#" class="menu-item">About</a>
                        </li>
                        <li class="menu-link">
                            <a href="#" class="menu-item">Services</a>
                        </li>
                        <li class="menu-link">
                            <a href="#" class="menu-item">Projects</a>
                        </li>
                        <li class="menu-link">
                            <a href="#" class="menu-button">CONTACT</a>
                        </li>
                    </ul>
                </nav>
                <div class="burger-icon">
                    <span></span>
                </div>
            </header>
            <h1 class="hero-title">We are creatives</h1>
            <div class="hero-arrow">
                <img src="./images/icon-arrow-down.svg" alt="Arrow Down">
            </div>
        </section>
        <main>
            <section class="transform">
                <div class="transform-content content-main">
                    <div class="content-block block-main">
                        <h2 class="content-block_title title-main">Transform your brand</h2>
                        <p class="content-block_text text-main">We are a full-service creative agency specializing in helping brands grow fast. Engage your clients through compelling visuals that do most of the marketing for you.</p>
                        <a href="#" class="content-block_link link-main">LEARN MORE</a>
                    </div>
                </div>
                <div class="transform-image image-main">
                    <img src="./images/desktop/image-transform.jpg" alt="Transform Image">
                </div>
            </section>
        </main>
    </div>

    <script src="./js/script.js"></script>
</body>
</html>
